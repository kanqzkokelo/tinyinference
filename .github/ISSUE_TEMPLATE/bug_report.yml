name: Bug report
description: Wrong output, crash, or build failure
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command line, expected output, actual output. First lines are enough.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and quantization
      placeholder: qwen2.5-0.5b-instruct-q4_0.gguf
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU, driver, CUDA version
      placeholder: RTX 3050 Laptop 4GB, 576.57, CUDA 12.9
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - Windows (native)
        - Windows (WSL)
    validations:
      required: true
  - type: textarea
    id: graph
    attributes:
      label: Does TT_NO_GRAPH=1 change it?
      description: If you did not try, say so. This separates graph capture from kernel math.
      placeholder: same / different / not tried
  - type: textarea
    id: build
    attributes:
      label: Build output
      description: Paste the first error, not the whole log.
      render: shell
