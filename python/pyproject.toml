[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyinference"
version = "0.9.0"
description = "GGUF LLM inference on CUDA, with an OpenAI-compatible server"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "tinyinference contributors" }]
keywords = ["llm", "inference", "gguf", "cuda", "quantization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/kanqzkokelo/tinyinference"

[project.scripts]
tinyinference = "tinyinference.__main__:main"

[tool.setuptools]
packages = ["tinyinference"]

[tool.setuptools.package-data]
tinyinference = ["bin/*"]
